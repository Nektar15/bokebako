<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A-09 お問い合わせ管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}summary::-webkit-details-marker{display:none}a{color:inherit}[role=cell] button,[role=cell] a{white-space:nowrap}
</style>
</helmet>
<div style="width: 1280px; height: 980px; display: flex; background: #F4EEE2; overflow: hidden">
<aside style="width: 232px; flex-shrink: 0; box-sizing: border-box; background: #1D1A16; color: #F4EEE2; display: flex; flex-direction: column; gap: 22px; padding: 20px 14px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 6px"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 19px; color: #FFFFFF">ぼけばこ</span>
<span style="background: #F2C230; color: #1D1A16; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">管理</span></div>
<nav aria-label="管理メニュー"><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
<li><a href="{{n.href}}" style="display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 10px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; text-decoration: none; font-size: 13.5px; font-weight: 700; line-height: 1.3">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: {{n.idc}}; width: 34px; flex-shrink: 0">{{n.id}}</span><span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{ false }}"><span style="background: #D6401E; color: #FFFFFF; border-radius: 99px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 900">{{n.count}}</span></sc-if>
</a></li>
</sc-for>
</ul></nav>
<div style="margin-top: auto; border-top: 1.5px solid #4A433B; padding: 14px 6px 0; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; border: 1.5px dashed #F2C230; color: #F2C230; border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 900">開発用の仮ログイン</span>
<span style="font-size: 14px; font-weight: 700; color: #FFFFFF">{{me.name}}</span>
<span style="font-size: 12px; color: #D9CFBE">{{me.role}}</span>
<span style="font-size: 12px; color: #D9CFBE">ログアウトはA-01実装後に有効</span>
</div>
</aside>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 2px solid #1D1A16; background: #FFFDF8">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #4A433B">A-09</span><h1 style="margin: 0; font-size: 22px; font-weight: 900">お問い合わせ管理</h1></div></div>
<div style="display: flex; align-items: center; gap: 10px"></div>
</header>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="height: 38px; padding: 0 14px; border: 2px solid #1D1A16; border-radius: 99px; background: {{t.bg}}; font-family: inherit; font-size: 13px; font-weight: 900; color: #1D1A16; cursor: pointer">{{t.label}} <span style="font-weight: 700; color: #4A433B">{{t.count}}</span></button>
</sc-for>
<span style="margin-left: auto; display: flex; gap: 8px"><select aria-label="種別" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; padding-right: 8px; width: 170px"><option>種別：すべて</option><option>一般問い合わせ</option><option>投稿削除依頼</option><option>権利侵害</option><option>広告掲載について</option><option>その他</option></select><select aria-label="期間" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; padding-right: 8px; width: 130px"><option>期間：すべて</option><option>7日</option><option>30日</option><option>期間指定</option></select></span>
</div>
<div style="display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; align-items: start">
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="q" hint-placeholder-count="4">
<li><button type="button" onClick="{{q.pick}}" aria-pressed="{{q.pressed}}" style="box-sizing: border-box; width: 100%; text-align: left; background: {{q.bg}}; border: 2px solid {{q.bc}}; box-shadow: {{q.sh}}; border-radius: 14px; padding: 12px 14px; font-family: inherit; color: #1D1A16; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px"><span style="background: {{q.b.bg}}; color: {{q.b.fg}}; border: 1.5px {{q.b.bs}} {{q.b.bc}}; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 900; white-space: nowrap">{{q.b.label}}</span><span style="font-size: 12px; font-weight: 900">{{q.type}}</span><span style="margin-left: auto; font-size: 11.5px; color: #4A433B">{{q.time}}</span></span>
<span style="font-size: 13.5px; font-weight: 700; line-height: 1.5">{{q.body}}</span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #4A433B">{{q.mail}}</span>
</button></li>
</sc-for>
</ul>
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 16px; box-shadow: 0 4px 0 #1D1A16; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); row-gap: 10px; font-size: 13.5px">
<span style="font-weight: 900; color: #4A433B">受付日時</span><span>{{d.time}}</span>
<span style="font-weight: 900; color: #4A433B">種別</span><span style="font-weight: 700">{{d.type}}</span>
<span style="font-weight: 900; color: #4A433B">メール</span><span style="display: flex; gap: 12px; align-items: center"><span style="font-family: ui-monospace, Menlo, monospace">{{d.mail}}</span><a href="{{d.mailto}}" style="font-weight: 900">メールで返信</a></span>
<span style="font-weight: 900; color: #4A433B">対象のURL</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12.5px">{{d.url}}</span>
</div>
<div style="background: #F4EEE2; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.8">{{d.body}}</div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 900">ステータス</span>
<div role="group" aria-label="ステータス" style="display: inline-grid; grid-template-columns: repeat(3, 110px); border: 2px solid #1D1A16; border-radius: 10px; overflow: hidden; width: max-content">
<sc-for list="{{statuses}}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 38px; border: 0; border-right: 1.5px solid #1D1A16; background: {{s.bg}}; font-family: inherit; font-size: 13px; font-weight: 900; color: #1D1A16; cursor: pointer">{{s.label}}</button></sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="memo" style="font-size: 13px; font-weight: 900">対応メモ</label>
<textarea id="memo" rows="3" placeholder="対応した内容を記録します（社内のみ）" style="box-sizing: border-box; width: 100%; resize: vertical; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 10px 12px; font-family: inherit; font-size: 14px; line-height: 1.6"></textarea>
<div style="display: flex; justify-content: flex-end"><button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; background: #1D1A16; color: #FFFFFF; border: 2px solid #1D1A16; font-family: inherit; font-size: 13.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; box-sizing: border-box; ">メモを保存</button></div></div>
<ul style="margin: 0; padding: 0; list-style: none"><sc-for list="{{d.memos}}" as="m" hint-placeholder-count="1">
<li style="display: flex; gap: 10px; padding: 8px 0; border-top: 1.5px solid #D9CFBE; font-size: 12.5px"><span style="color: #4A433B; width: 150px; flex-shrink: 0">{{m.time}}</span><span>{{m.text}}</span></li>
</sc-for></ul>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 980}}'>
class Component extends DCLogic {
  constructor(...args) { super(...args); this.state = { sel: 0, tab: 'すべて' }; }

  navItems(active) {
    const N = [['A-02', 'ダッシュボード', 'A02-Dashboard.dc.html', 0], ['A-03', '大喜利', 'A03-Oogiri.dc.html', 0], ['A-04', '回答', 'A04-Answers.dc.html', 0],
      ['A-05', '通報・モデレーション', 'A05-Moderation.dc.html', 6], ['A-06', 'NGワード', 'A06-NgWords.dc.html', 0], ['A-07', '広告', 'A07-Ads.dc.html', 0],
      ['A-08', 'OGP', 'A08-Ogp.dc.html', 0], ['A-09', 'お問い合わせ', 'A09-Inquiries.dc.html', 2], ['A-10', '運用設定', 'A10-Settings.dc.html', 0]];
    return N.map((n) => {
      const on = n[0] === active;
      return { id: n[0], label: n[1], href: n[2], count: String(n[3]), hasCount: n[3] > 0, bg: on ? '#F2C230' : 'transparent', fg: on ? '#1D1A16' : '#F4EEE2', idc: on ? '#1D1A16' : '#B8AD9C' };
    });
  }
  me(role) { return { name: 'dev-admin', role: role || '上位管理者' }; }
  badge(s) {
    const M = {
      open: ['募集中', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], awaiting: ['結果選択待ち', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      decided: ['結果確定', '#1D1A16', '#FFFFFF', '#1D1A16', 'solid'], no_result: ['結果未選出', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'],
      hidden: ['一時非表示', '#FFFDF8', '#A93115', '#A93115', 'dashed'], deleted: ['削除済み', '#FFFDF8', '#4A433B', '#8A8071', 'dashed'],
      visible: ['公開', '#FFFDF8', '#1D1A16', '#1D1A16', 'solid'],
      reject: ['投稿拒否', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], review: ['要確認', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      live: ['掲載中', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], scheduled: ['予約', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      stopped: ['停止', '#FFFDF8', '#A93115', '#A93115', 'dashed'], ended: ['終了', '#E6DDCC', '#4A433B', '#8A8071', 'solid'],
      todo: ['未対応', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], doing: ['対応中', '#F2C230', '#1D1A16', '#1D1A16', 'solid'], done: ['対応済み', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'],
      ok: ['完了', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'], failed: ['失敗', '#FFFDF8', '#A93115', '#A93115', 'dashed']
    };
    const m = M[s];
    return { label: m[0], bg: m[1], fg: m[2], bc: m[3], bs: m[4] };
  }

  renderVals() {
    const base = { nav: this.navItems('A-09'), me: this.me(this.roleName) };
    const s = this.state || {};
    const Q = [
      { type: '投稿削除依頼', time: '10/09 08:12', mail: 'yuki.t@example.com', url: 'https://bokebako.com/o/k7Qm2xPz', st: 'todo', body: '自分のことを書かれていると思われる回答があります。削除をお願いします。', memos: [] },
      { type: '広告掲載について', time: '10/08 19:40', mail: 'ad@marumaru.example.jp', url: '—', st: 'todo', body: 'バナー広告の掲載を検討しています。料金と掲載できる期間を教えてください。', memos: [] },
      { type: '権利侵害', time: '10/07 13:05', mail: 'legal@studio.example.co.jp', url: 'https://bokebako.com/o/Zp3cW9aQ', st: 'doing', body: '当社のキャラクター名を使ったお題が公開されています。確認をお願いします。', memos: [['10/07 15:20 dev-admin', '対象のお題を一時非表示にした。先方へ確認の返信済み。']] },
      { type: '一般問い合わせ', time: '10/05 22:48', mail: 'nekonote@example.com', url: '—', st: 'done', body: '開催者ページを開けなくなりました。合言葉を忘れてしまいました。', memos: [['10/06 10:02 dev-admin', '合言葉は運営でも確認できない旨を返信。']] }
    ];
    const ov = s.ov || {};
    const sel = s.sel ?? 0;
    const tab = s.tab || 'すべて';
    const stOf = (i) => ov[i] || Q[i].st;
    const L = { todo: '未対応', doing: '対応中', done: '対応済み' };
    const d = Q[sel];
    return Object.assign(base, {
      tabs: [['未対応', '2'], ['対応中', '1'], ['対応済み', '14'], ['すべて', '17']].map((t) => ({ label: t[0], count: t[1], pressed: t[0] === tab ? 'true' : 'false', bg: t[0] === tab ? '#F2C230' : '#FFFDF8', pick: () => this.setState({ tab: t[0] }) })),
      items: Q.map((q, i) => ({ q: q, i: i })).filter((x) => tab === 'すべて' || L[stOf(x.i)] === tab).map((x) => ({
        type: x.q.type, time: x.q.time, mail: x.q.mail, body: x.q.body, b: this.badge(stOf(x.i)),
        pressed: x.i === sel ? 'true' : 'false', bg: x.i === sel ? '#FFFDF8' : 'transparent', bc: x.i === sel ? '#1D1A16' : '#D9CFBE', sh: x.i === sel ? '0 3px 0 #1D1A16' : 'none',
        pick: () => this.setState({ sel: x.i }) })),
      d: { type: d.type, time: '2026年' + d.time.replace('/', '月').replace(' ', '日 '), mail: d.mail, mailto: 'mailto:' + d.mail, url: d.url, body: d.body,
        memos: d.memos.length ? d.memos.map((m) => ({ time: m[0], text: m[1] })) : [{ time: '—', text: 'まだメモはありません' }] },
      statuses: ['todo', 'doing', 'done'].map((k) => ({ label: L[k], pressed: stOf(sel) === k ? 'true' : 'false', bg: stOf(sel) === k ? '#F2C230' : '#FFFFFF',
        pick: () => { const o = Object.assign({}, ov); o[sel] = k; this.setState({ ov: o }); } }))
    });
  }
}
</script>
</body>
</html>
