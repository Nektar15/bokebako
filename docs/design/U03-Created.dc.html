<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { copied: false };
  }
  renderVals() {
    const copied = !!(this.state && this.state.copied);
    return {
      copyLabel: copied ? 'コピー済み' : 'コピー',
      copyBg: copied ? '#F2C230' : '#FFFDF8',
      copy: () => {
        try { navigator.clipboard.writeText('https://bokebako.com/o/k7Qm2xPz'); } catch (e) {}
        this.setState({ copied: true });
        setTimeout(() => this.setState({ copied: false }), 1800);
      }
    };
  }
}
