<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-04 大喜利回答画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
a{color:#1D1A16}a:hover{color:#A93115}
@keyframes blink{50%{opacity:.25}}
</style>
</helmet>
<div style="width: 390px; height: 1120px; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span>
</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">遊び方</a>
</header>

<div style="padding: 12px 20px 0; display: flex; justify-content: center">
<div style="width: 320px; height: 50px; box-sizing: border-box; border: 1.5px dashed #8A8071; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5A5248"><span style="border: 1px solid #5A5248; border-radius: 3px; padding: 0 4px; font-size: 10px; font-weight: 700">PR</span>スポンサー広告枠（上部）320×50</div>
</div>

<section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 6px; background: #1D1A16; color: #FFFFFF; border-radius: 99px; padding: 4px 12px 4px 10px; font-size: 12px; font-weight: 900"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F2C230; animation: blink 1.4s infinite"></span>回答募集中</span>
<span style="font-size: 13px; font-weight: 700; color: #4A433B">現在 <b style="font-size: 17px; color: #1D1A16">47</b> 回答</span>
</div>

<div style="position: relative; background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; box-shadow: 0 4px 0 #1D1A16; padding: 30px 18px 22px">
<span style="position: absolute; top: -13px; left: 16px; background: #F2C230; border: 2px solid #1D1A16; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 900">お題</span>
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.42">こんなコンビニ店員は嫌だ</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 13px; font-weight: 700; color: #4A433B">締切まで</span>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px; font-variant-numeric: tabular-nums">残り 18<small style="font-size: 13px">時間</small>32<small style="font-size: 13px">分</small></span>
</div>
<div style="height: 12px; border: 2px solid #1D1A16; border-radius: 99px; background: #FFFFFF; overflow: hidden"><div style="width: 77%; height: 100%; background: #D6401E"></div></div>
</div>
</section>

<section style="padding: 24px 20px 0">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="boke" style="font-weight: 900; font-size: 15px">あなたのボケ</label>
<span style="font-size: 12px; color: #5A5248; font-variant-numeric: tabular-nums">{{count}}</span>
</div>
<textarea id="boke" rows="4" value="{{boke}}" onChange="{{onBoke}}" placeholder="ここにボケを書く" style="box-sizing: border-box; width: 100%; resize: none; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.6; color: #1D1A16"></textarea>
<p style="margin: 0; font-size: 12.5px; color: #4A433B">名前も登録もいりません。匿名で投稿されます。</p>
<a href="U05-AnswerConfirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 17px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">回答する</a>
</div>
</section>

<section style="padding: 18px 20px 0">
<div style="display: flex; gap: 12px; align-items: center; border: 2px dashed #1D1A16; border-radius: 14px; padding: 14px 16px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2" style="flex-shrink: 0" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V7 A4 4 0 0 1 16 7 V11"></path></svg>
<p style="margin: 0; font-size: 13px; line-height: 1.6"><b>みんなのボケは、回答すると見られます。</b><br><span style="color: #4A433B">まずは誰にも引っ張られず、自分の頭で。</span></p>
</div>
</section>

<div style="padding: 12px 20px 0; display: flex; justify-content: flex-end">
<button type="button" style="min-height: 44px; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #4A433B; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21 V4 M5 4 H16 L14 8 L16 12 H5"></path></svg>
このお題を通報する
</button>
</div>

<div style="margin-top: auto; padding: 0 20px 24px; display: flex; justify-content: center">
<div style="width: 320px; height: 50px; box-sizing: border-box; border: 1.5px dashed #8A8071; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5A5248"><span style="border: 1px solid #5A5248; border-radius: 3px; padding: 0 4px; font-size: 10px; font-weight: 700">PR</span>スポンサー広告枠（下部）320×50</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { boke: '' };
  }
  renderVals() {
    const b = (this.state && this.state.boke) || '';
    return {
      boke: b,
      count: b.length + ' / 140',
      onBoke: (e) => this.setState({ boke: e.target.value.slice(0, 140) })
    };
  }
}
</script>
</body>
</html>
