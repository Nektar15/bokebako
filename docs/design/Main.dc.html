<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-01 トップ・大喜利開催</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
a{color:#1D1A16}a:hover{color:#A93115}
</style>
</helmet>
<div style="width: 390px; height: 1300px; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span>
</a>
<a href="#howto" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">遊び方</a>
</header>

<div style="padding: 12px 20px 0; display: flex; justify-content: center">
<div style="width: 320px; height: 50px; box-sizing: border-box; border: 1.5px dashed #8A8071; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5A5248"><span style="border: 1px solid #5A5248; border-radius: 3px; padding: 0 4px; font-size: 10px; font-weight: 700">PR</span>スポンサー広告枠（上部）320×50</div>
</div>

<section style="padding: 28px 20px 4px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex"><span style="background: #F2C230; border: 2px solid #1D1A16; border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 900">登録不要・24時間限定の大喜利</span></div>
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.32">お題を出したら、<br><span style="color: #D6401E">24時間</span>だけ<br>大喜利スタート。</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4A433B">Xでシェアして、みんなからボケを集めよう。</p>
</section>

<section style="padding: 18px 20px 0">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; box-shadow: 0 4px 0 #1D1A16; padding: 20px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="odai" style="font-weight: 900; font-size: 15px">お題</label>
<span style="font-size: 12px; color: #5A5248; font-variant-numeric: tabular-nums">{{count}}</span>
</div>
<textarea id="odai" rows="3" value="{{odai}}" onChange="{{onOdai}}" placeholder="例：こんなコンビニ店員は嫌だ" style="box-sizing: border-box; width: 100%; resize: none; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.5; color: #1D1A16"></textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; font-weight: 700; color: #4A433B">テンプレートから選ぶ</span>
<button type="button" onClick="{{randomize}}" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 2px solid #1D1A16; border-radius: 99px; background: #F2C230; font-family: inherit; font-size: 13px; font-weight: 900; color: #1D1A16; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.4" fill="currentColor"></circle><circle cx="16" cy="16" r="1.4" fill="currentColor"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor"></circle></svg>
ランダム
</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{templates}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 14px; border: 1.5px solid #1D1A16; border-radius: 99px; background: #F4EEE2; font-family: inherit; font-size: 13.5px; font-weight: 700; color: #1D1A16; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="border-top: 2px dashed #D9CFBE"></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aik" style="font-weight: 900; font-size: 15px">合言葉</label>
<input id="aik" type="text" value="{{aikotoba}}" onChange="{{onAik}}" autocomplete="off" placeholder="あなただけが分かる言葉" style="box-sizing: border-box; width: 100%; height: 50px; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1D1A16">
<p style="margin: 0; display: flex; gap: 6px; font-size: 12.5px; line-height: 1.6; color: #4A433B">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12 L20 3 M17 6 L20 9"></path></svg>
<span>別の端末から開催者ページを開くときに使います。ふだんは入力不要です。</span>
</p>
</div>

<a href="U02-Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 17px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">24時間大喜利を開催する</a>
</div>
</section>

<section id="howto" style="padding: 36px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 900">あそびかた</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<li style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #1D1A16; color: #F4EEE2; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 13px">1</span>
<span style="font-size: 13.5px; font-weight: 900">お題を出す</span>
<span style="font-size: 11.5px; line-height: 1.5; color: #4A433B">登録なしで今すぐ</span>
</li>
<li style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #1D1A16; color: #F4EEE2; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 13px">2</span>
<span style="font-size: 13.5px; font-weight: 900">Xで募集</span>
<span style="font-size: 11.5px; line-height: 1.5; color: #4A433B">回答は24時間だけ</span>
</li>
<li style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #D6401E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 13px">3</span>
<span style="font-size: 13.5px; font-weight: 900">ベスト3発表</span>
<span style="font-size: 11.5px; line-height: 1.5; color: #4A433B">あなたが選ぶ</span>
</li>
</ol>
</section>

<div style="padding: 28px 20px 0; display: flex; justify-content: center">
<div style="width: 320px; height: 50px; box-sizing: border-box; border: 1.5px dashed #8A8071; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5A5248"><span style="border: 1px solid #5A5248; border-radius: 3px; padding: 0 4px; font-size: 10px; font-weight: 700">PR</span>スポンサー広告枠（下部）320×50</div>
</div>

<footer style="margin-top: auto; padding: 16px 20px 24px; border-top: 2px solid #1D1A16; display: flex; flex-direction: column; gap: 8px">
<nav style="display: flex; flex-wrap: wrap; column-gap: 16px; font-size: 12.5px">
<a href="#" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">利用規約</a>
<a href="#" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">プライバシーポリシー</a>
<a href="#" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">投稿ガイドライン</a>
<a href="#" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">お問い合わせ</a>
</nav>
<small style="font-size: 11px; color: #5A5248">© ぼけばこ</small>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { odai: '', aikotoba: '' };
  }
  renderVals() {
    const T = ['こんな○○は嫌だ', '○○が絶対に言わない一言', '100年後の○○あるある', '絶対に売れない○○の商品名とは？'];
    const s = this.state || {};
    const odai = s.odai || '';
    return {
      odai: odai,
      count: odai.length + ' / 100',
      aikotoba: s.aikotoba || '',
      templates: T.map((t) => ({ label: t, pick: () => this.setState({ odai: t }) })),
      randomize: () => this.setState({ odai: T[Math.floor(Math.random() * T.length)] }),
      onOdai: (e) => this.setState({ odai: e.target.value.slice(0, 100) }),
      onAik: (e) => this.setState({ aikotoba: e.target.value })
    };
  }
}
</script>
</body>
</html>
