<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-18 お問い合わせ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}summary::-webkit-details-marker{display:none}a{color:#1D1A16}a:hover{color:#A93115}
</style>
</helmet>
<div style="width: 390px; height: 1380px; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span></a>
<a href="U14-About.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">遊び方</a>
</header>
<section style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 27px">お問い合わせ</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3A342D">投稿の削除依頼や権利侵害のご連絡、広告掲載のご相談もこちらから。</p>
</section>

<sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
<section style="padding: 20px 20px 36px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; box-shadow: 0 4px 0 #1D1A16; padding: 20px; display: flex; flex-direction: column; gap: 22px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; padding: 0; margin-bottom: 10px">お問い合わせの種類<span style="background: #D6401E; color: #FFFFFF; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">必須</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 44px; padding: 0 14px; border: 2px solid #1D1A16; border-radius: 99px; background: {{t.bg}}; font-family: inherit; font-size: 13.5px; font-weight: 700; color: #1D1A16; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mail" style="display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px">メールアドレス<span style="background: #D6401E; color: #FFFFFF; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">必須</span></label>
<input id="mail" type="email" autocomplete="email" placeholder="you@example.com" style="box-sizing: border-box; width: 100%; height: 50px; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1D1A16">
<p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4A433B">返信が必要なときに使います。公開されることはありません。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="url" style="display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px">対象のURL<sc-if value="{{urlRequired}}" hint-placeholder-val="{{ true }}"><span style="background: #D6401E; color: #FFFFFF; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">必須</span></sc-if></label>
<input id="url" type="url" placeholder="https://bokebako.com/o/..." style="box-sizing: border-box; width: 100%; height: 50px; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1D1A16">
<p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4A433B">投稿削除依頼・権利侵害の場合は、対象の大喜利のURLをご記入ください。</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="body" style="display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px">お問い合わせ内容<span style="background: #D6401E; color: #FFFFFF; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">必須</span></label>
<textarea id="body" rows="6" placeholder="できるだけ具体的にご記入ください" style="box-sizing: border-box; width: 100%; resize: vertical; border: 2px solid #1D1A16; border-radius: 12px; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.6; color: #1D1A16"></textarea>
</div>
<div style="height: 78px; box-sizing: border-box; border: 1.5px dashed #8A8071; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5A5248">CAPTCHA（サービス選定中）</div>
<button type="button" onClick="{{submit}}" style="height: 56px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-family: inherit; font-size: 16.5px; font-weight: 900; box-shadow: 0 4px 0 #1D1A16; cursor: pointer">送信する</button>
<p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4A433B; text-align: center">送信前に<a href="U16-Privacy.dc.html" style="font-weight: 700">プライバシーポリシー</a>をご確認ください。</p>
</div>
</section>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<section style="padding: 40px 20px 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<svg width="120" height="100" viewBox="0 0 120 100" aria-hidden="true">
<rect x="34" y="10" width="52" height="36" rx="3" fill="#FFFDF8" stroke="#1D1A16" stroke-width="3" transform="rotate(-6 60 28)"></rect>
<path d="M36 14 L60 32 L84 12" fill="none" stroke="#1D1A16" stroke-width="3" stroke-linejoin="round" transform="rotate(-6 60 28)"></path>
<rect x="10" y="46" width="100" height="50" rx="8" fill="#D6401E" stroke="#1D1A16" stroke-width="3"></rect>
<path d="M36 60 H84" stroke="#1D1A16" stroke-width="5" stroke-linecap="round"></path>
</svg>
<h2 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px">送信しました</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.8; color: #3A342D">内容を確認のうえ、必要に応じてメールでご連絡します。<br>返信まで数日かかることがあります。</p>
<div style="align-self: stretch; margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 2px solid #1D1A16; border-radius: 14px; background: #FFFDF8; font-size: 15px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">トップへ戻る</a>
<button type="button" onClick="{{reset}}" style="min-height: 48px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #1D1A16; text-decoration: underline; cursor: pointer">別の内容でもう一度送る</button>
</div>
</section>
</sc-if>
<footer style="margin-top: auto; padding: 16px 20px 24px; border-top: 2px solid #1D1A16; display: flex; flex-direction: column; gap: 8px">
<nav style="display: flex; flex-wrap: wrap; column-gap: 16px; font-size: 12.5px"><a href="U15-Terms.dc.html" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">利用規約</a><a href="U16-Privacy.dc.html" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">プライバシーポリシー</a><a href="U17-Guidelines.dc.html" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">投稿ガイドライン</a><a href="U18-Contact.dc.html" style="min-height: 40px; display: flex; align-items: center; text-decoration: none">お問い合わせ</a></nav>
<small style="font-size: 11px; color: #5A5248">© ぼけばこ</small>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1380}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { type: '一般問い合わせ', sent: false };
  }
  renderVals() {
    const s = this.state || {};
    const T = ['一般問い合わせ', '投稿削除依頼', '権利侵害', '広告掲載について', 'その他'];
    return {
      isForm: !s.sent,
      isDone: !!s.sent,
      urlRequired: s.type === '投稿削除依頼' || s.type === '権利侵害',
      types: T.map((t) => ({ label: t, pressed: s.type === t ? 'true' : 'false', bg: s.type === t ? '#F2C230' : '#FFFFFF', pick: () => this.setState({ type: t }) })),
      submit: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
