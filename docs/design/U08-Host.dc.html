<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-08 開催者専用画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
a{color:#1D1A16}a:hover{color:#A93115}
</style>
</helmet>
<div style="width: 390px; height: 1560px; position: relative; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span>
</a>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 900">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V7 A4 4 0 0 1 16 7 V11"></path></svg>
開催者ページ</span>
</header>

<div style="background: #1D1A16; color: #FFFFFF; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: 19px">募集終了。ベスト回答を選んでください。</p>
<p style="margin: 0; font-size: 12.5px; color: #D9CFBE">選べる期限：あと <b style="color: #F2C230">71時間12分</b>（過ぎると「選出なし」で公開されます）</p>
</div>

<section style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; color: #4A433B">お題</span>
<h1 style="margin: 0; font-size: 20px; font-weight: 900; line-height: 1.45">こんなコンビニ店員は嫌だ</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700; color: #4A433B">回答</span><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">47</span></div>
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700; color: #4A433B">PV</span><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">1,284</span></div>
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 700; color: #4A433B">お気に入り</span><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">3</span></div>
</div>
</section>

<section style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 900">あなたのベスト3</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 6px 12px 6px 6px; border: 2px {{s.borderStyle}} #1D1A16; border-radius: 14px; background: {{s.bg}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: {{s.badgeBg}}; color: {{s.badgeFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 14px">{{s.label}}</span>
<span style="font-size: 14px; font-weight: 700; line-height: 1.45; color: {{s.textColor}}">{{s.text}}</span>
</li>
</sc-for>
</ol>
<p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4A433B">下の回答をタップした順に 1位・2位・3位 が入ります。もう一度タップで外せます。1件だけでも発表できます。</p>
</section>

<section style="padding: 20px 20px 130px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 900">集まったボケ（47）</h2>
<span style="font-size: 12px; font-weight: 700; color: #4A433B">新着順</span>
</div>
<sc-for list="{{answers}}" as="a" hint-placeholder-count="7">
<button type="button" onClick="{{a.toggle}}" aria-pressed="{{a.pressed}}" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 14px 14px; border: 2px solid #1D1A16; border-radius: 16px; background: {{a.bg}}; box-shadow: {{a.shadow}}; font-family: inherit; color: #1D1A16; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; border: 2px solid #1D1A16; background: {{a.badgeBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Dela Gothic One', sans-serif; font-size: 12px">{{a.rank}}</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15.5px; font-weight: 700; line-height: 1.6">{{a.text}}</span>
<span style="font-size: 11.5px; color: #5A5248">{{a.time}}</span>
</span>
</button>
</sc-for>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F4EEE2; border-top: 2px solid #1D1A16; padding: 12px 20px 22px">
<a href="U09-ResultConfirm.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 58px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 16.5px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">結果を発表する<span style="background: #FFFFFF; color: #1D1A16; border-radius: 99px; padding: 1px 9px; font-size: 12.5px">{{countLabel}}</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { picks: [4, 2] };
  }
  renderVals() {
    const A = [
      { text: '「袋いりますか？」のあとに、10秒の沈黙を置いてくる', time: '9月17日 22:14' },
      { text: '深夜になると、急に関西弁になる', time: '9月17日 21:58' },
      { text: 'おでんの具を選ぶたびに、小さく「正解」とつぶやく', time: '9月17日 21:40' },
      { text: 'レシートの裏に、毎回ちがう詩を書いてくれる', time: '9月17日 20:03' },
      { text: '「温めますか？」と聞いてから、自分の手で温めはじめる', time: '9月17日 18:21' },
      { text: 'お釣りを全部1円玉で、ひとつずつ数えながら渡してくる', time: '9月17日 15:47' },
      { text: 'ポイントカードの有無を、前世の話から聞いてくる', time: '9月17日 11:09' }
    ];
    const picks = (this.state && this.state.picks) || [];
    const toggle = (i) => {
      const p = picks.slice();
      const at = p.indexOf(i);
      if (at >= 0) p.splice(at, 1); else if (p.length < 3) p.push(i);
      this.setState({ picks: p });
    };
    return {
      countLabel: picks.length + '件',
      slots: [0, 1, 2].map((k) => {
        const has = picks[k] !== undefined;
        return {
          label: (k + 1) + '位',
          text: has ? A[picks[k]].text : 'まだ選ばれていません',
          bg: has ? (k === 0 ? '#FFF1C2' : '#FFFDF8') : 'transparent',
          borderStyle: has ? 'solid' : 'dashed',
          badgeBg: has ? (k === 0 ? '#D6401E' : '#1D1A16') : '#E6DDCC',
          badgeFg: has ? '#FFFFFF' : '#5A5248',
          textColor: has ? '#1D1A16' : '#5A5248'
        };
      }),
      answers: A.map((a, i) => {
        const r = picks.indexOf(i);
        const on = r >= 0;
        return {
          text: a.text,
          time: a.time,
          rank: on ? (r + 1) + '位' : '',
          pressed: on ? 'true' : 'false',
          bg: on ? '#FFF1C2' : '#FFFDF8',
          shadow: on ? '0 4px 0 #1D1A16' : 'none',
          badgeBg: on ? (r === 0 ? '#D6401E' : '#1D1A16') : '#FFFFFF',
          toggle: () => toggle(i)
        };
      })
    };
  }
}
</script>
</body>
</html>
