<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A-04 回答管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}summary::-webkit-details-marker{display:none}a{color:inherit}[role=cell] button,[role=cell] a{white-space:nowrap}
</style>
</helmet>
<div style="width: 1280px; height: 1000px; display: flex; background: #F4EEE2; overflow: hidden">
<aside style="width: 232px; flex-shrink: 0; box-sizing: border-box; background: #1D1A16; color: #F4EEE2; display: flex; flex-direction: column; gap: 22px; padding: 20px 14px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 6px"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 19px; color: #FFFFFF">ぼけばこ</span>
<span style="background: #F2C230; color: #1D1A16; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 900">管理</span></div>
<nav aria-label="管理メニュー"><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
<li><a href="{{n.href}}" style="display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 10px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; text-decoration: none; font-size: 13.5px; font-weight: 700; line-height: 1.3">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: {{n.idc}}; width: 34px; flex-shrink: 0">{{n.id}}</span><span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{ false }}"><span style="background: #D6401E; color: #FFFFFF; border-radius: 99px; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 900">{{n.count}}</span></sc-if>
</a></li>
</sc-for>
</ul></nav>
<div style="margin-top: auto; border-top: 1.5px solid #4A433B; padding: 14px 6px 0; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; border: 1.5px dashed #F2C230; color: #F2C230; border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 900">開発用の仮ログイン</span>
<span style="font-size: 14px; font-weight: 700; color: #FFFFFF">{{me.name}}</span>
<span style="font-size: 12px; color: #D9CFBE">{{me.role}}</span>
<span style="font-size: 12px; color: #D9CFBE">ログアウトはA-01実装後に有効</span>
</div>
</aside>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 2px solid #1D1A16; background: #FFFDF8">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #4A433B">A-04</span><h1 style="margin: 0; font-size: 22px; font-weight: 900">回答管理</h1></div></div>
<div style="display: flex; align-items: center; gap: 10px"></div>
</header>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<input type="text" aria-label="キーワード" placeholder="本文で検索" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; width: 220px"><input type="text" aria-label="お題" placeholder="お題（ID・スラッグ）" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; width: 180px"><select aria-label="状態" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; padding-right: 8px; width: 140px"><option>状態：すべて</option><option>公開</option><option>一時非表示</option><option>削除済み</option></select><select aria-label="通報数" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; padding-right: 8px; width: 130px"><option>通報：すべて</option><option>1件以上</option><option>3件以上</option></select><select aria-label="期間" style="box-sizing: border-box; height: 40px; border: 2px solid #1D1A16; border-radius: 10px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1D1A16; padding-right: 8px; width: 130px"><option>期間：すべて</option><option>今日</option><option>7日</option><option>30日</option><option>期間指定</option></select><button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; background: #1D1A16; color: #FFFFFF; border: 2px solid #1D1A16; font-family: inherit; font-size: 13.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; box-sizing: border-box; ">検索</button>
</div>
<sc-if value="{{isSuper}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #4A433B"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V7 A4 4 0 0 1 16 7 V11"></path></svg>「投稿元」の列は、上位管理者にだけ表示されます（ハッシュ化した値のみ）。</p>
</sc-if>
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 16px; padding: 4px 8px 8px">
<div role="table" style="display: flex; flex-direction: column">
<div role="row" style="display: grid; grid-template-columns: {{cols}}; align-items: center; border-bottom: 1.5px solid #D9CFBE">
<div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">ID</div><div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">本文</div><div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">お題</div><div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">投稿日時</div>
<div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap; text-align: right">通報</div><div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">状態</div>
<sc-if value="{{isSuper}}" hint-placeholder-val="{{ true }}"><div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V7 A4 4 0 0 1 16 7 V11"></path></svg>投稿元</span></div></sc-if>
<div role="columnheader" style="text-align: left; padding: 10px 10px; font-size: 12px; font-weight: 900; color: #4A433B; border-bottom: 2px solid #1D1A16; white-space: nowrap">操作</div>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div role="row" style="display: grid; grid-template-columns: {{cols}}; align-items: center; border-bottom: 1.5px solid #D9CFBE">
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; font-family: ui-monospace, Menlo, monospace; font-size: 12px">{{r.id}}</div>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; font-weight: 700">{{r.text}}</div>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; font-size: 12px; color: #4A433B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.odai}}</div>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; font-size: 12px; white-space: nowrap">{{r.time}}</div>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; text-align: right; font-weight: {{r.repW}}; color: {{r.repC}}">{{r.rep}}</div>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle"><span style="background: {{r.b.bg}}; color: {{r.b.fg}}; border: 1.5px {{r.b.bs}} {{r.b.bc}}; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 900; white-space: nowrap">{{r.b.label}}</span></div>
<sc-if value="{{isSuper}}" hint-placeholder-val="{{ true }}"><div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.6; color: #4A433B">IP {{r.ip}}<br>ID {{r.bid}}</div></sc-if>
<div role="cell" style="min-width: 0; padding: 11px 10px; font-size: 13px; line-height: 1.5; vertical-align: middle"><div style="display: flex; gap: 4px; align-items: center">
<button type="button" style="height: 32px; padding: 0 10px; border: 1.5px solid #1D1A16; border-radius: 8px; background: #FFFDF8; font-family: inherit; font-size: 12px; font-weight: 900; cursor: pointer">{{r.toggle}}</button>
<button type="button" aria-label="削除" style="width: 32px; height: 32px; border: 0; background: transparent; color: #A93115; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7 H20 M9 7 V4 H15 V7 M6 7 L7 20 H17 L18 7"></path></svg></button>
</div></div>
</div>
</sc-for>

</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12.5px; color: #4A433B">1–20件 ／ 全402,118件</span><div style="display: flex; gap: 6px"><button type="button" style="width: 36px; height: 36px; border: 2px solid #1D1A16; border-radius: 8px; background: #F2C230; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">1</button><button type="button" style="width: 36px; height: 36px; border: 2px solid #1D1A16; border-radius: 8px; background: #FFFDF8; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">2</button><button type="button" style="width: 36px; height: 36px; border: 2px solid #1D1A16; border-radius: 8px; background: #FFFDF8; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">3</button><button type="button" style="width: 36px; height: 36px; border: 2px solid #1D1A16; border-radius: 8px; background: #FFFDF8; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">…</button><button type="button" style="width: 36px; height: 36px; border: 2px solid #1D1A16; border-radius: 8px; background: #FFFDF8; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">624</button></div></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 1000}, "role": {"editor": "enum", "options": ["上位管理者", "一般管理者"], "default": "上位管理者"}}'>
class Component extends DCLogic {

  navItems(active) {
    const N = [['A-02', 'ダッシュボード', 'A02-Dashboard.dc.html', 0], ['A-03', '大喜利', 'A03-Oogiri.dc.html', 0], ['A-04', '回答', 'A04-Answers.dc.html', 0],
      ['A-05', '通報・モデレーション', 'A05-Moderation.dc.html', 6], ['A-06', 'NGワード', 'A06-NgWords.dc.html', 0], ['A-07', '広告', 'A07-Ads.dc.html', 0],
      ['A-08', 'OGP', 'A08-Ogp.dc.html', 0], ['A-09', 'お問い合わせ', 'A09-Inquiries.dc.html', 2], ['A-10', '運用設定', 'A10-Settings.dc.html', 0]];
    return N.map((n) => {
      const on = n[0] === active;
      return { id: n[0], label: n[1], href: n[2], count: String(n[3]), hasCount: n[3] > 0, bg: on ? '#F2C230' : 'transparent', fg: on ? '#1D1A16' : '#F4EEE2', idc: on ? '#1D1A16' : '#B8AD9C' };
    });
  }
  me(role) { return { name: 'dev-admin', role: role || '上位管理者' }; }
  badge(s) {
    const M = {
      open: ['募集中', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], awaiting: ['結果選択待ち', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      decided: ['結果確定', '#1D1A16', '#FFFFFF', '#1D1A16', 'solid'], no_result: ['結果未選出', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'],
      hidden: ['一時非表示', '#FFFDF8', '#A93115', '#A93115', 'dashed'], deleted: ['削除済み', '#FFFDF8', '#4A433B', '#8A8071', 'dashed'],
      visible: ['公開', '#FFFDF8', '#1D1A16', '#1D1A16', 'solid'],
      reject: ['投稿拒否', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], review: ['要確認', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      live: ['掲載中', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], scheduled: ['予約', '#F2C230', '#1D1A16', '#1D1A16', 'solid'],
      stopped: ['停止', '#FFFDF8', '#A93115', '#A93115', 'dashed'], ended: ['終了', '#E6DDCC', '#4A433B', '#8A8071', 'solid'],
      todo: ['未対応', '#D6401E', '#FFFFFF', '#D6401E', 'solid'], doing: ['対応中', '#F2C230', '#1D1A16', '#1D1A16', 'solid'], done: ['対応済み', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'],
      ok: ['完了', '#E6DDCC', '#1D1A16', '#1D1A16', 'solid'], failed: ['失敗', '#FFFDF8', '#A93115', '#A93115', 'dashed']
    };
    const m = M[s];
    return { label: m[0], bg: m[1], fg: m[2], bc: m[3], bs: m[4] };
  }

  renderVals() {
    const base = { nav: this.navItems('A-04'), me: this.me(this.roleName) };
    const isSuper = (this.props.role ?? '上位管理者') === '上位管理者';
    const R = [
      ['A-90412', '「袋いりますか？」のあとに、10秒の沈黙を置いてくる', 'こんなコンビニ店員は嫌だ', '10/09 22:14', 0, 'visible', '3fa1…9c0e', 'b72d…41af'],
      ['A-90411', '深夜になると、急に関西弁になる', 'こんなコンビニ店員は嫌だ', '10/09 21:58', 0, 'visible', '91c4…2b7d', '0e5a…c3d1'],
      ['A-90398', '2組の〇〇がやりそうなこと全部', 'うちの担任の嫌なところ選手権', '10/09 18:02', 5, 'hidden', 'aa02…7f13', '5d9e…0b42'],
      ['A-90377', 'LINEのIDはこちら→', '100年後の運動会あるある', '10/09 17:31', 1, 'hidden', 'c810…e5a2', '77f0…19be'],
      ['A-90360', '玉入れの玉が全部ドローン', '100年後の運動会あるある', '10/09 17:05', 0, 'visible', '4b6e…d091', 'e2c8…a774'],
      ['A-90341', 'このお題、主催者のセンス0点', '絶対に流行らない新しい挨拶', '10/09 15:40', 2, 'visible', '19dd…6a3f', '8c13…f0e9'],
      ['A-90322', '「おはようございました」', '絶対に流行らない新しい挨拶', '10/09 14:12', 0, 'visible', '6f2a…31c8', 'd4b7…5e20'],
      ['A-90301', '（同じ文面の連続投稿）', 'ロボットが絶対に言わない一言', '10/09 12:48', 0, 'deleted', 'aa02…7f13', '5d9e…0b42'],
      ['A-90288', '「充電させてください」と言って、人に寄りかかる', 'ロボットが絶対に言わない一言', '10/09 11:20', 0, 'visible', 'e910…0c55', '3a6b…92dd']
    ];
    this.roleName = isSuper ? '上位管理者' : '一般管理者';
    return Object.assign(base, {
      me: this.me(this.roleName), isSuper: isSuper,
      cols: isSuper ? '76px minmax(0, 1fr) 160px 96px 44px 98px 118px 110px' : '76px minmax(0, 1fr) 160px 96px 44px 98px 110px',
      rows: R.map((r) => ({ id: r[0], text: r[1], odai: r[2], time: r[3], rep: r[4], b: this.badge(r[5]), ip: r[6], bid: r[7],
        repW: r[4] >= 3 ? '900' : '400', repC: r[4] >= 3 ? '#A93115' : '#1D1A16', toggle: r[5] === 'visible' ? '非表示' : '再公開' }))
    });
  }
}
</script>
</body>
</html>
