<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-07 回答後・回答一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
a{color:#1D1A16}a:hover{color:#A93115}
</style>
</helmet>
<div style="width: 390px; height: 1520px; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span>
</a>
</header>

<div style="background: #FFFDF8; border-bottom: 2px solid #1D1A16; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: 19px; line-height: 1.4">こんなコンビニ店員は嫌だ</p>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700">
<span>残り 18時間32分</span>
<span style="color: #4A433B">47 回答</span>
</div>
<div style="height: 8px; border: 2px solid #1D1A16; border-radius: 99px; background: #FFFFFF; overflow: hidden"><div style="width: 77%; height: 100%; background: #D6401E"></div></div>
</div>

<section style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 18px; font-weight: 900">みんなのボケ</h1>
<span style="font-size: 12.5px; font-weight: 700; color: #4A433B">新着順</span>
</div>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{answers}}" as="a" hint-placeholder-count="7">
<li style="background: {{a.bg}}; border: 2px solid #1D1A16; border-radius: 16px; padding: 14px 10px 6px 16px; display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{a.mine}}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; background: #1D1A16; color: #FFFFFF; border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 900">あなたの回答</span>
</sc-if>
<p style="margin: 0; padding-right: 6px; font-size: 16.5px; font-weight: 700; line-height: 1.6">{{a.text}}</p>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; color: #5A5248">{{a.time}}</span>
<div style="display: flex">
<button type="button" aria-label="この回答をXでシェア" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #1D1A16; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15 V3 M7 8 L12 3 L17 8 M5 13 V19 A2 2 0 0 0 7 21 H17 A2 2 0 0 0 19 19 V13"></path></svg></button>
<button type="button" aria-label="この回答を通報" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #5A5248; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21 V4 M5 4 H16 L14 8 L16 12 H5"></path></svg></button>
</div>
</div>
</li>
</sc-for>
</ul>

<button type="button" style="height: 50px; border: 2px solid #1D1A16; border-radius: 14px; background: #FFFDF8; font-family: inherit; font-size: 14.5px; font-weight: 900; color: #1D1A16; cursor: pointer">もっと見る</button>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #4A433B; text-align: center">ぼけばこに「いいね」や投票はありません。<br>ベストは、お題を出した人が選びます。</p>
</section>

<section style="padding: 26px 20px 28px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; box-shadow: 0 4px 0 #1D1A16; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 15px; font-weight: 900">見てるだけじゃ、もったいない。</p>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 16px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">自分も大喜利を開催する</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1520}}'>
class Component extends DCLogic {
  renderVals() {
    const A = [
      { text: '「袋いりますか？」のあとに、10秒の沈黙を置いてくる', time: 'たった今', mine: true },
      { text: '深夜になると、急に関西弁になる', time: '2分前' },
      { text: 'おでんの具を選ぶたびに、小さく「正解」とつぶやく', time: '5分前' },
      { text: 'レシートの裏に、毎回ちがう詩を書いてくれる', time: '9分前' },
      { text: '「温めますか？」と聞いてから、自分の手で温めはじめる', time: '14分前' },
      { text: 'お釣りを全部1円玉で、ひとつずつ数えながら渡してくる', time: '21分前' },
      { text: 'ポイントカードの有無を、前世の話から聞いてくる', time: '33分前' }
    ];
    return {
      answers: A.map((a) => ({ text: a.text, time: a.time, mine: !!a.mine, bg: a.mine ? '#FFF1C2' : '#FFFDF8' }))
    };
  }
}
</script>
</body>
</html>
