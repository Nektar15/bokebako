<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>U-13 非表示ページ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE2;color:#1D1A16;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}summary::-webkit-details-marker{display:none}a{color:#1D1A16}a:hover{color:#A93115}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4EEE2; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1D1A16">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D1A16"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 15 L12.5 3.5 L22 4.8 L20.5 15" fill="#F2C230" stroke="#1D1A16" stroke-width="2.2" stroke-linejoin="round"></path><rect x="3" y="12" width="26" height="17" rx="3" fill="#D6401E" stroke="#1D1A16" stroke-width="2.2"></rect><path d="M10 17 H22" stroke="#1D1A16" stroke-width="2.6" stroke-linecap="round"></path></svg><span style="font-family: 'Dela Gothic One', sans-serif; font-size: 22px">ぼけばこ</span></a>
<a href="U14-About.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">遊び方</a>
</header>
<section style="padding: 44px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<svg width="132" height="100" viewBox="0 0 132 100" aria-hidden="true">
<rect x="14" y="26" width="104" height="66" rx="8" fill="#E6DDCC" stroke="#1D1A16" stroke-width="3"></rect>
<path d="M40 44 H92" stroke="#1D1A16" stroke-width="5" stroke-linecap="round"></path>
<rect x="6" y="48" width="120" height="16" fill="#F2C230" stroke="#1D1A16" stroke-width="3" transform="rotate(-14 66 56)"></rect>
<rect x="6" y="48" width="120" height="16" fill="#F2C230" stroke="#1D1A16" stroke-width="3" transform="rotate(14 66 56)"></rect>
</svg>
<h1 style="margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 23px; line-height: 1.45">この大喜利は現在<br>公開されていません</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.75; color: #3A342D">投稿内容または通報状況を確認した結果、<br>現在公開を停止しています。</p>
</section>

<sc-if value="{{isGeneral}}" hint-placeholder-val="{{ true }}">
<section style="margin-top: auto; padding: 0 20px 32px; display: flex; flex-direction: column; gap: 12px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 16.5px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">新しく大喜利を開催する</a>
</section>
</sc-if>

<sc-if value="{{isFixable}}" hint-placeholder-val="{{ false }}">
<section style="padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; background: #F2C230; border: 2px solid #1D1A16; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 900">開催者の方へ</span>
<p style="margin: 0; font-size: 15px; font-weight: 900; line-height: 1.6">お題の内容を見直せば、もう一度募集できます。</p>
<p style="margin: 0; font-size: 12.5px; line-height: 1.7; color: #4A433B">修正したお題は、新しい大喜利として24時間の募集を始めます。</p>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border: 2px solid #1D1A16; border-radius: 14px; background: #D6401E; color: #FFFFFF; font-size: 16.5px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">内容を修正して再募集する</a>
<a href="U17-Guidelines.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 14.5px; font-weight: 700">投稿ガイドラインを確認する</a>
</section>
</sc-if>

<sc-if value="{{isSevere}}" hint-placeholder-val="{{ false }}">
<section style="padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFDF8; border: 2px solid #1D1A16; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; background: #F2C230; border: 2px solid #1D1A16; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 900">開催者の方へ</span>
<p style="margin: 0; font-size: 15px; font-weight: 900; line-height: 1.6">この大喜利は、ガイドラインに反する内容のため再募集できません。</p>
<a href="U17-Guidelines.dc.html" style="align-self: flex-start; min-height: 40px; display: flex; align-items: center; font-size: 13.5px; font-weight: 700">投稿ガイドラインを確認する</a>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 2px solid #1D1A16; border-radius: 14px; background: #FFFDF8; font-size: 15px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #1D1A16">トップへ戻る</a>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "viewer": {"editor": "enum", "options": ["一般ユーザー", "開催者（修正可能な違反）", "開催者（重大な違反）"], "default": "一般ユーザー"}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.viewer ?? '一般ユーザー';
    return { isGeneral: v === '一般ユーザー', isFixable: v === '開催者（修正可能な違反）', isSevere: v === '開催者（重大な違反）' };
  }
}
</script>
</body>
</html>
