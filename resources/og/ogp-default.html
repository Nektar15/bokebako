<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!--
  既定の OGP 画像（public/assets/img/ogp-default.png）の原本。トップ・規約などのページと、画像を作れなかった大喜利のカードに使う。
  作り直し方：このファイルをブラウザで 1200×630 の大きさに開いて撮る（Playwright なら viewport 1200×630 で screenshot）。
  背景とロゴは同じフォルダの backdrop.png・logo.png（OGP 画像の生成と同じもの）。
-->
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#F4EEE2;font-family:'Zen Kaku Gothic New',sans-serif;color:#1D1A16}
.bg{position:absolute;inset:0;width:1200px;height:630px}
.logo{position:absolute;left:80px;top:54px;display:flex;align-items:center;gap:14px;font-family:'Dela Gothic One';font-size:34px}
.logo img{width:56px;height:56px}
.pill{position:absolute;right:80px;top:60px;background:#F2C230;border:3px solid #1D1A16;padding:8px 20px;font-weight:900;font-size:22px}
.card{position:absolute;left:130px;right:130px;top:150px;height:340px;background:#FFFDF8;border:4px solid #1D1A16;border-radius:28px;box-shadow:10px 10px 0 #1D1A16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
h1{font-family:'Dela Gothic One';font-weight:400;font-size:62px;line-height:1.3;text-align:center}
h1 em{font-style:normal;color:#D6401E}
p{font-size:28px;font-weight:700;color:#4A433B}
.bar{position:absolute;left:0;right:0;bottom:0;height:18px;background:#D6401E}
</style></head><body>
<img class="bg" src="backdrop.png" alt="">
<div class="logo"><img src="logo.png" alt="">ぼけばこ</div>
<div class="pill">登録不要・匿名</div>
<div class="card">
<h1>お題を出したら、<br><em>24時間</em>だけ大喜利スタート。</h1>
<p>Xでシェアして、みんなからボケを集めよう</p>
</div>
<div class="bar"></div>
</body></html>
